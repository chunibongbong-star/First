<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>숭이둥이 플래너</title>
<meta name="theme-color" content="#7cc0ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="숭이둥이">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: sky-and-grass header band (clock + weather), then a two-column board:
   big month calendar on the left, the two to-do lists and "오늘" on the right. */
:root{
  --sky-top:#7cc0ee; --sky-bot:#bfe3fa; --grass:#69b84a; --grass-dark:#4c9632;
  --ground:#e8f2fb; --panel:#ffffff; --line:#b7d0e6; --ink:#24364a; --muted:#7489a0;
  --soong:#ec6b95; --soong-bg:#fde3ec; --doong:#e9a623; --doong-bg:#fdf0d2;
  --both:#4fa86a; --both-bg:#dcf1e2; --sun:#ff9a3c; --sat:#3a7fd5; --accent:#2f6fc0;
  --f-pixel:"DotGothic16","Courier New",monospace;
  --f-head:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-text-size-adjust:100%}
img{max-width:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header band */
.sky{background:linear-gradient(var(--sky-top),var(--sky-bot));position:relative;
  margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.sky::after{content:"";display:block;height:14px;
  background:repeating-linear-gradient(90deg,var(--grass) 0 10px,var(--grass-dark) 10px 12px);
  border-top:3px solid var(--grass-dark)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:16px 24px;padding-block:12px 10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%;justify-content:flex-end}
.tab{border:2px solid #fff;background:rgba(255,255,255,.55);border-radius:8px;padding:5px 12px;font-family:var(--f-head);font-size:15px;display:flex;gap:6px;align-items:center}
.tab[aria-selected="true"]{background:#fff;box-shadow:0 2px 0 var(--line)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.clockbox{display:flex;flex-direction:column;gap:2px;min-width:0}
.dateline{font-family:var(--f-head);font-size:22px;color:#fff;text-shadow:0 2px 0 rgba(30,70,120,.45)}
.clock{font-family:var(--f-pixel);font-size:clamp(52px,9vw,96px);line-height:.95;color:#fff;letter-spacing:2px;
  text-shadow:4px 0 0 #2b4a6e,-4px 0 0 #2b4a6e,0 4px 0 #2b4a6e,0 -4px 0 #2b4a6e,4px 4px 0 #2b4a6e,6px 7px 0 rgba(30,60,100,.35);
  font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:10px}
.clock small{font-family:var(--f-head);font-size:18px;text-shadow:none;color:#2b4a6e;letter-spacing:0}
.me{font-size:13px;color:#2b4a6e;display:flex;gap:6px;align-items:center}
.me select{border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px 6px}

/* weather */
.weather{flex:1 1 420px;min-width:0;background:rgba(255,255,255,.93);border:2px solid var(--line);border-radius:12px;padding:10px 14px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.w-main{display:flex;align-items:center;gap:10px}
.w-icon{width:44px;height:44px}
.w-temp{font-family:var(--f-pixel);font-size:44px;line-height:1}
.w-sub{font-size:13px;color:var(--muted);line-height:1.4}
.w-sub b{color:var(--ink);font-family:var(--f-head);font-weight:400;font-size:15px}
.outfit{min-width:0}
.outfit-title{font-family:var(--f-head);font-size:14px;color:var(--accent)}
.outfit-items{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-size:12.5px;padding:2px 8px;border-radius:999px;background:#eef5fc;border:1px solid var(--line);white-space:nowrap}
.w-tip{grid-column:1/-1;font-size:13px;color:#3c6a3a;border-top:1px dashed var(--line);padding-top:6px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.linkbtn{border:none;background:none;color:var(--accent);font-size:13px;padding:0;text-decoration:underline}

/* board */
main{padding-block:14px 24px}
.board{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0;box-shadow:0 3px 0 #d3e3f1}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.ph h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:20px;display:flex;align-items:center;gap:8px}
.ph h2::before{content:"";width:5px;height:18px;background:var(--accent);border-radius:2px}
.legend{display:flex;gap:10px;font-size:12px;color:var(--muted)}
.legend span{display:flex;gap:4px;align-items:center}

/* calendar */
.calnav{display:flex;gap:4px;align-items:center}
.calnav button{border:1px solid var(--line);background:#f4f9fe;border-radius:6px;padding:2px 10px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:2px solid var(--line)}
.dow{text-align:center;font-family:var(--f-head);font-size:14px;padding:4px 0;color:var(--muted)}
.dow:first-child{color:var(--sun)} .dow:last-child{color:var(--sat)}
.day{min-height:96px;border-top:1px solid #e3edf6;padding:4px 3px;text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;display:flex;flex-direction:column;gap:2px;min-width:0}
.day:hover{background:#f3f8fd}
.dnum{font-family:var(--f-pixel);font-size:17px;width:28px;height:28px;display:grid;place-items:center;border-radius:50%}
.day.sun .dnum{color:var(--sun)} .day.sat .dnum{color:var(--sat)}
.day.out{opacity:.35}
.day.today{background:#fff6ec}
.day.today .dnum{background:var(--sun);color:#fff}
.ev{font-size:12px;line-height:1.35;padding:1px 4px;border-left:3px solid;border-radius:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-숭이{border-color:var(--soong);background:var(--soong-bg)}
.who-둥이{border-color:var(--doong);background:var(--doong-bg)}
.who-함께{border-color:var(--both);background:var(--both-bg)}
.more{font-size:11px;color:var(--muted);padding-left:4px}

/* todos */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.todo-head{display:flex;align-items:center;gap:8px;font-family:var(--f-head);font-size:19px;margin-bottom:6px}
.badge{font-family:var(--f-body);font-size:12px;color:var(--muted)}
.todos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.todo{display:flex;align-items:center;gap:8px;padding:4px 2px;border-bottom:1px dashed #e3edf6;min-width:0}
.todo input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--accent)}
.todo .t{flex:1;min-width:0;overflow-wrap:anywhere}
.todo.done .t{text-decoration:line-through;color:var(--muted)}
.due{font-size:11px;padding:1px 6px;border-radius:999px;background:#eef5fc;color:var(--accent);white-space:nowrap}
.due.late{background:#ffe6e0;color:#c4482b}
.due.today{background:#fff0dc;color:#c66d00}
.del{border:none;background:none;color:#b7c6d6;font-size:16px;padding:0 4px;line-height:1}
.del:hover{color:#c4482b}
.add{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pair>div{min-width:0}
.add input[type=text]{flex:1 1 100%;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fbfdff}
.add input[type=date]{flex:1;min-width:0;width:auto;border:1px solid var(--line);border-radius:6px;padding:4px;background:#fbfdff;font-size:13px}
.btn{border:none;border-radius:6px;padding:6px 12px;background:var(--accent);color:#fff;font-family:var(--f-head);white-space:nowrap}
.btn.ghost{background:#eef5fc;color:var(--accent)}
.empty{color:var(--muted);font-size:13px;padding:6px 2px}

/* today */
.today-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}
.sub{font-family:var(--f-head);font-size:16px;margin:0 0 4px;color:var(--sun)}
.sub.tmr{color:var(--accent)}
.trow{display:flex;gap:8px;align-items:baseline;padding:3px 0;min-width:0}
.trow time{font-family:var(--f-pixel);font-size:15px;color:var(--accent);width:46px;flex:none}
.trow .tt{border-left:3px solid;padding-left:6px;min-width:0;overflow-wrap:anywhere}

/* person view */
.person{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px}
.person .todo{font-size:17px;padding:7px 2px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,40,70,.35);display:grid;place-items:center;padding:16px;z-index:20}
.modal{background:#fff;border-radius:14px;border:2px solid var(--line);width:min(440px,100%);max-height:90vh;overflow:auto;padding:16px}
.modal h3{margin:0 0 10px;font-family:var(--f-head);font-weight:400;font-size:22px}
.mlist{list-style:none;padding:0;margin:0 0 12px;display:flex;flex-direction:column;gap:6px}
.mlist li{display:flex;gap:8px;align-items:center;padding:6px 8px;border-left:4px solid;border-radius:6px}
.mlist .tt{flex:1;min-width:0;overflow-wrap:anywhere}
.mform{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mform label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.mform .full{grid-column:1/-1}
.mform input,.mform select{border:1px solid var(--line);border-radius:6px;padding:7px 8px;background:#fbfdff;width:100%}
.mactions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}

.status{font-size:12px;color:var(--muted);padding-block:6px 0;display:flex;gap:6px;align-items:center}
.status .live{width:8px;height:8px;border-radius:50%;background:#bbb}
.status.on .live{background:#3cb371;box-shadow:0 0 0 3px rgba(60,179,113,.2)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;z-index:30}

@media (max-width:1000px){
  .board,.person{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){
  .pair,.today-grid{grid-template-columns:minmax(0,1fr)}
  .day{min-height:64px}
  .ev{font-size:10.5px;padding:0 2px}
  .weather{grid-template-columns:1fr}
  .tabs{justify-content:flex-start}
  .add{flex-wrap:wrap}
  .add input[type=date]{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.hours{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.hours div{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.hours b{font-family:var(--f-pixel);font-weight:400;color:var(--ink);font-size:14px}
.h-icon{width:20px;height:20px}
.city{font-size:12px;color:var(--muted);display:flex;gap:4px;align-items:center}
.city select{border:1px solid var(--line);border-radius:6px;background:#fff;padding:2px 4px;font-size:13px}
.setup p{margin:0 0 10px;line-height:1.6}
.setup .row{display:flex;gap:6px;flex-wrap:wrap}
.setup input{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:8px;background:#fbfdff}
.setup hr{border:none;border-top:1px dashed var(--line);margin:14px 0}
.setup .note{font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>

<div class="sky">
  <div class="wrap top">
    <nav class="tabs" role="tablist" aria-label="보기">
      <button class="tab" role="tab" data-view="dash" aria-selected="true">🏠 대시보드</button>
      <button class="tab" role="tab" data-view="숭이" aria-selected="false"><span class="dot" style="background:var(--soong)"></span>숭이</button>
      <button class="tab" role="tab" data-view="둥이" aria-selected="false"><span class="dot" style="background:var(--doong)"></span>둥이</button>
      <button class="tab" id="shareBtn" type="button">🔗 공유</button>
    </nav>
    <div class="clockbox">
      <div class="dateline" id="dateline">&nbsp;</div>
      <div class="clock"><small id="ampm"></small><span id="clock">--:--</span></div>
      <label class="me" for="meSel">이 기기 사용자
        <select id="meSel"><option>숭이</option><option>둥이</option></select>
      </label>
    </div>
    <section class="weather" id="weather" aria-label="날씨와 옷차림"></section>
  </div>
</div>

<main class="wrap">
  <div id="dashView" class="board">
    <div class="col">
      <section class="panel" aria-label="달력">
        <div class="ph">
          <h2 id="calTitle">달력</h2>
          <div class="legend">
            <span><i class="dot" style="background:var(--soong)"></i>숭이</span>
            <span><i class="dot" style="background:var(--doong)"></i>둥이</span>
            <span><i class="dot" style="background:var(--both)"></i>함께</span>
          </div>
          <div class="calnav">
            <button id="prevM" aria-label="이전 달">◀</button>
            <button id="todayM">오늘</button>
            <button id="nextM" aria-label="다음 달">▶</button>
          </div>
        </div>
        <div class="cal" id="cal"></div>
      </section>
    </div>
    <div class="col">
      <section class="panel" aria-label="할 일">
        <div class="pair">
          <div id="todo-숭이"></div>
          <div id="todo-둥이"></div>
        </div>
      </section>
      <section class="panel" aria-label="오늘">
        <div class="ph"><h2>오늘 할 일</h2><span class="badge" id="todayLabel"></span></div>
        <div class="today-grid" id="today"></div>
      </section>
    </div>
  </div>

  <div id="personView" class="person" hidden>
    <section class="panel" id="personTodos"></section>
    <section class="panel">
      <div class="ph"><h2 id="personUpTitle">다가오는 일정</h2></div>
      <div id="personUp"></div>
    </section>
  </div>

  <div class="status" id="status"><span class="live"></span><span id="statusText">연결 중…</span></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <h3 id="mTitle"></h3>
    <ul class="mlist" id="mList"></ul>
    <form class="mform" id="mForm">
      <label class="full" for="evTitle">일정 내용
        <input id="evTitle" type="text" maxlength="60" placeholder="예: 치과 예약, 장보기" required>
      </label>
      <label for="evTime">시간 (선택)
        <input id="evTime" type="time">
      </label>
      <label for="evWho">누구
        <select id="evWho"><option>숭이</option><option>둥이</option><option>함께</option></select>
      </label>
      <div class="mactions full">
        <button type="button" class="btn ghost" id="mClose">닫기</button>
        <button type="submit" class="btn">일정 추가</button>
      </div>
    </form>
  </div>
</div>
<div class="overlay" id="setup" hidden>
  <div class="modal setup" role="dialog" aria-modal="true" aria-labelledby="setupTitle">
    <h3 id="setupTitle">함께 쓰기</h3>
    <div id="setupStart">
      <p>로그인 없이 <b>링크 하나</b>로 둘이 같은 플래너를 써요.<br>한 사람이 만들고, 생긴 링크를 상대에게 보내면 끝이에요.</p>
      <button class="btn" id="createBtn" type="button">새 가족 플래너 만들기</button>
      <hr>
      <form id="joinForm">
        <label for="joinCode" class="note">받은 링크나 코드가 있다면 붙여넣기</label>
        <div class="row"><input id="joinCode" type="text" placeholder="https://…#코드"><button class="btn ghost" type="submit">연결</button></div>
      </form>
    </div>
    <div id="setupShare" hidden>
      <p>이 링크를 남편(아내)에게 카톡으로 보내 주세요.<br>같은 링크로 열면 둘의 달력과 할 일이 자동으로 맞춰져요.</p>
      <div class="row"><input id="shareLink" type="text" readonly aria-label="공유 링크"><button class="btn" id="copyBtn" type="button">복사</button></div>
      <p class="note" style="margin-top:10px">⚠ 이 링크를 아는 사람은 누구나 보고 고칠 수 있어요. 가족끼리만 나눠 주세요.<br>📱 휴대폰에서는 브라우저 메뉴의 <b>'홈 화면에 추가'</b>를 누르면 앱처럼 쓸 수 있어요.</p>
      <button class="linkbtn" id="newFromShare" type="button">다른 플래너 만들기 / 연결하기</button>
    </div>
    <div class="mactions"><button class="btn ghost" id="setupClose" type="button">닫기</button></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const PEOPLE = ["숭이", "둥이"];
  const COLOR = { 숭이: "var(--soong)", 둥이: "var(--doong)", 함께: "var(--both)" };
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const parse = (s) => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const todayStr = () => ymd(new Date());
  const md = (s) => { const d = parse(s); return `${d.getMonth() + 1}/${d.getDate()}(${DOW[d.getDay()]})`; };

  const store = {
    get(k, f) { try { return localStorage.getItem(k) ?? f; } catch { return f; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const state = {
    events: [], todos: [], weather: null, weatherErr: false,
    month: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
    view: "dash", me: store.get("planner.me", "숭이"), modalDate: null,
  };
  $("#meSel").value = state.me;

  /* ---------- shared storage (jsonblob.com, no login; the family code is the key) ---------- */
  const API = "https://jsonblob.com/api/jsonBlob";
  const empty = () => ({ app: "soongdoong-planner", rev: 0, events: [], todos: [], settings: { city: "서울" } });
  const normalize = (d) => ({ ...empty(), ...(d && typeof d === "object" ? d : {}),
    events: Array.isArray(d?.events) ? d.events : [], todos: Array.isArray(d?.todos) ? d.todos : [],
    settings: { city: "서울", ...(d?.settings || {}) } });
  const clone = (o) => JSON.parse(JSON.stringify(o));
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  let code = null, data = empty(), pending = 0, online = false;
  try { data = normalize(JSON.parse(store.get("planner.cache", "null"))); } catch {}

  async function http(method, url, body) {
    const r = await fetch(url, { method, cache: "no-store",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) { const e = new Error("HTTP " + r.status); e.status = r.status; throw e; }
    return r;
  }
  async function createBlob(initial) {
    const r = await http("POST", API, initial);
    const id = r.headers.get("X-jsonblob-id") || (r.headers.get("Location") || "").split("/").pop();
    if (!id) throw new Error("no id");
    return id;
  }
  const pull = async () => normalize(await (await http("GET", `${API}/${code}`)).json());
  async function push(d) { d.rev = (d.rev || 0) + 1; d.savedAt = Date.now(); await http("PUT", `${API}/${code}`, d); }

  function setStatus(on, text) { online = on; $("#status").classList.toggle("on", on); $("#statusText").textContent = text; }
  const okStatus = () => setStatus(true, "자동 동기화 중 · 둘 중 누가 바꿔도 몇 초 안에 반영돼요");
  function failStatus(e) {
    if (e?.status === 404) setStatus(false, "공유 저장소를 찾을 수 없어요 (링크가 틀렸거나 오래 안 써서 만료됐어요). 오른쪽 위 '공유'에서 새로 만들 수 있어요.");
    else setStatus(false, "인터넷 연결을 확인해 주세요. 연결되면 자동으로 다시 맞춰요.");
  }

  function apply() {
    state.events = data.events; state.todos = data.todos;
    store.set("planner.cache", JSON.stringify(data));
    if ($("#citySel") && $("#citySel").value !== data.settings.city) loadWeather();
    renderAll();
  }

  // Every change: apply locally right away, then re-read the latest copy, apply the same change to it, and save.
  let queue = Promise.resolve();
  function mutate(fn) {
    fn(data); apply();
    if (!code) return;
    pending++;
    queue = queue.then(async () => {
      try {
        const latest = await pull(); fn(latest); await push(latest);
        data = latest; okStatus();
      } catch (e) { failStatus(e); toast("저장하지 못했어요. 연결되면 다시 시도해 주세요."); }
      finally { pending--; apply(); }
    });
  }
  const api = {
    add(col, obj) { const id = uid(); mutate((d) => d[col].push({ id, ...obj })); },
    update(col, id, patch) { mutate((d) => { const x = d[col].find((v) => v.id === id); if (x) Object.assign(x, patch); }); },
    remove(col, id) { mutate((d) => { d[col] = d[col].filter((v) => v.id !== id); }); },
    clearDone(owner) { mutate((d) => { d.todos = d.todos.filter((t) => !(t.owner === owner && t.done)); }); },
    setCity(city) { mutate((d) => { d.settings.city = city; }); },
  };
  const guard = (x) => x;

  async function refresh() {
    if (!code || pending || document.hidden) return;
    try {
      const latest = await pull();
      if (pending) return;
      if (latest.rev !== data.rev || JSON.stringify(latest) !== JSON.stringify(data)) { data = latest; apply(); }
      okStatus();
    } catch (e) { failStatus(e); }
  }

  /* ---------- family code & sharing ---------- */
  const codeFromText = (s) => { const m = String(s || "").trim().match(/([A-Za-z0-9_-]{8,})\/?\s*$/); return m ? m[1] : null; };
  const shareLink = () => `${location.origin}${location.pathname}#${code}`;
  function useCode(c) {
    code = c; store.set("planner.code", c);
    if (location.hash.slice(1) !== c) history.replaceState(null, "", "#" + c);
    setStatus(false, "불러오는 중…"); refresh();
  }
  function showSetup(mode) {
    $("#setup").hidden = false;
    $("#setupStart").hidden = mode !== "start";
    $("#setupShare").hidden = mode !== "share";
    if (mode === "share") $("#shareLink").value = shareLink();
  }
  $("#createBtn").onclick = async () => {
    const b = $("#createBtn"); b.disabled = true; b.textContent = "만드는 중…";
    try {
      const init = normalize(clone(data)); init.rev = 1;
      const id = await createBlob(init);
      data = init; useCode(id); apply(); showSetup("share");
    } catch { toast("만들지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."); }
    b.disabled = false; b.textContent = "새 가족 플래너 만들기";
  };
  $("#joinForm").onsubmit = (e) => {
    e.preventDefault();
    const c = codeFromText($("#joinCode").value);
    if (!c) { toast("공유 링크나 코드를 그대로 붙여넣어 주세요."); return; }
    data = empty(); apply(); useCode(c); $("#setup").hidden = true;
  };
  $("#copyBtn").onclick = async () => {
    try { await navigator.clipboard.writeText(shareLink()); toast("링크를 복사했어요. 카톡으로 보내 주세요!"); }
    catch { $("#shareLink").select(); toast("링크를 길게 눌러 복사해 주세요."); }
  };
  $("#shareBtn").onclick = () => showSetup(code ? "share" : "start");
  $("#setupClose").onclick = () => { $("#setup").hidden = true; };
  $("#newFromShare").onclick = () => showSetup("start");
  window.addEventListener("hashchange", () => { const c = codeFromText(location.hash.slice(1)); if (c && c !== code) { data = empty(); apply(); useCode(c); } });

  function connect() {
    const c = codeFromText(location.hash.slice(1)) || store.get("planner.code", null);
    if (c) useCode(c); else { setStatus(false, "아직 공유 플래너가 없어요 · 오른쪽 위 '공유'를 눌러 시작하세요"); showSetup("start"); }
    setInterval(refresh, 10000);
    document.addEventListener("visibilitychange", refresh);
    window.addEventListener("focus", refresh);
  }

  /* ---------- clock ---------- */
  function tick() {
    const n = new Date();
    $("#dateline").textContent = `${n.getMonth() + 1}월 ${n.getDate()}일 ${DOW[n.getDay()]}요일`;
    const h = n.getHours();
    $("#ampm").textContent = h < 12 ? "오전" : "오후";
    $("#clock").textContent = `${(h % 12) || 12}:${String(n.getMinutes()).padStart(2, "0")}`;
    if (tick.last && tick.last !== ymd(n)) { renderAll(); loadWeather(); }
    tick.last = ymd(n);
  }

  /* ---------- weather (Open-Meteo, automatic) & outfit ---------- */
  const CITIES = { 서울: [37.5665, 126.978], 인천: [37.4563, 126.7052], 수원: [37.2636, 127.0286], 성남: [37.42, 127.1265],
    고양: [37.6584, 126.832], 용인: [37.2411, 127.1776], 부천: [37.5034, 126.766], 화성: [37.1995, 126.8312], 남양주: [37.636, 127.2165],
    춘천: [37.8813, 127.7298], 강릉: [37.7519, 128.8761], 청주: [36.6424, 127.489], 천안: [36.8151, 127.1139], 세종: [36.48, 127.289],
    대전: [36.3504, 127.3845], 전주: [35.8242, 127.148], 광주: [35.1595, 126.8526], 대구: [35.8714, 128.6014], 포항: [36.019, 129.3435],
    울산: [35.5384, 129.3114], 창원: [35.228, 128.6811], 부산: [35.1796, 129.0756], 제주: [33.4996, 126.5312] };
  const OUTFITS = [
    [28, "한여름", ["민소매", "반팔", "반바지", "린넨 원피스"]],
    [23, "더운 날", ["반팔", "얇은 셔츠", "반바지", "면바지"]],
    [20, "선선함", ["긴팔 티", "얇은 가디건", "면바지", "청바지"]],
    [17, "쌀쌀함", ["맨투맨", "얇은 니트", "가디건", "청바지"]],
    [12, "꽤 쌀쌀", ["자켓", "가디건", "야상", "스타킹", "청바지"]],
    [9, "추워요", ["트렌치코트", "자켓", "니트", "기모 바지"]],
    [5, "많이 추워요", ["코트", "가죽 자켓", "히트텍", "니트", "레깅스"]],
    [-99, "한겨울", ["롱패딩", "두꺼운 코트", "목도리", "장갑", "기모 제품"]],
  ];
  const skyOf = (c) => c === 0 ? ["맑음", "sun"] : c <= 2 ? ["구름 조금", "partly"] : c <= 48 ? ["흐림", "cloud"]
    : (c >= 71 && c <= 77) || c === 85 || c === 86 ? ["눈", "snow"] : ["비", "rain"];
  function icon(kind, cls = "w-icon") {
    const sun = '<circle cx="22" cy="22" r="9" fill="#ffc83a" stroke="#f29b1d" stroke-width="2"/>' +
      [0, 45, 90, 135, 180, 225, 270, 315].map((a) => `<rect x="21" y="3" width="2" height="6" fill="#f29b1d" transform="rotate(${a} 22 22)"/>`).join("");
    const cloud = (x, y, c = "#fff") => `<path d="M${x} ${y}h20a6 6 0 0 0 0-12a8 8 0 0 0-15-2a6 6 0 0 0-5 14z" fill="${c}" stroke="#8aa6c2" stroke-width="2"/>`;
    const parts = { sun, partly: sun + cloud(14, 36), cloud: cloud(8, 30, "#eef3f8") + cloud(14, 38),
      rain: cloud(10, 28) + '<path d="M16 33l-2 6M23 33l-2 6M30 33l-2 6" stroke="#3a7fd5" stroke-width="2.5" stroke-linecap="round"/>',
      snow: cloud(10, 28) + '<g fill="#7fb2e6"><circle cx="15" cy="37" r="2"/><circle cx="23" cy="40" r="2"/><circle cx="31" cy="37" r="2"/></g>' };
    return `<svg class="${cls}" viewBox="0 0 44 44" aria-hidden="true">${parts[kind] || sun}</svg>`;
  }
  let weatherCity = null;
  async function loadWeather() {
    const city = CITIES[data.settings.city] ? data.settings.city : "서울";
    const [lat, lon] = CITIES[city];
    weatherCity = city;
    try {
      const u = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
        "&current=temperature_2m,apparent_temperature,weather_code" +
        "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max" +
        "&hourly=temperature_2m,weather_code&timezone=Asia%2FSeoul&forecast_days=1";
      const j = await (await fetch(u, { cache: "no-store" })).json();
      const hours = [8, 12, 16, 20].map((h) => ({ h, t: Math.round(j.hourly.temperature_2m[h]), c: j.hourly.weather_code[h] }));
      state.weather = { city, temp: Math.round(j.current.temperature_2m), feel: Math.round(j.current.apparent_temperature),
        code: j.current.weather_code, max: Math.round(j.daily.temperature_2m_max[0]), min: Math.round(j.daily.temperature_2m_min[0]),
        rain: j.daily.precipitation_probability_max?.[0] ?? null, hours, at: new Date() };
      state.weatherErr = false;
    } catch { state.weatherErr = true; }
    renderWeather();
  }
  function renderWeather() {
    const el = $("#weather"), w = state.weather;
    const cityOpts = Object.keys(CITIES).map((c) => `<option ${c === (weatherCity || data.settings.city) ? "selected" : ""}>${c}</option>`).join("");
    const citySel = `<label class="city" for="citySel">지역 <select id="citySel">${cityOpts}</select></label>`;
    if (!w) {
      el.innerHTML = `<div class="w-main">${icon("partly")}<div class="w-sub"><b>${state.weatherErr ? "날씨를 불러오지 못했어요" : "날씨 불러오는 중…"}</b><br>${state.weatherErr ? "인터넷 연결 후 자동으로 다시 시도해요." : ""}</div></div><div></div><div class="w-tip"><span></span>${citySel}</div>`;
    } else {
      const [skyName, kind] = skyOf(w.code);
      const base = Math.round((w.temp + w.max) / 2);
      const [, label, items] = OUTFITS.find(([t]) => base >= t);
      const gap = w.max - w.min;
      const tip = w.rain != null && w.rain >= 50 ? `비 올 확률 ${w.rain}% · 우산 챙기세요 ☂` : kind === "snow" ? "눈 소식 · 미끄럼 주의, 방수 신발 추천"
        : gap >= 10 ? `일교차 ${gap}°! 겉옷을 꼭 챙기세요` : base < 5 ? "핫팩 하나 챙기면 든든해요" : "나들이하기 괜찮은 날이에요";
      el.innerHTML = `
        <div class="w-main">${icon(kind)}
          <div class="w-temp">${w.temp}°</div>
          <div class="w-sub"><b>${skyName}</b><br>최고 ${w.max}° · 최저 ${w.min}°<br>체감 ${w.feel}°${w.rain != null ? ` · 강수 ${w.rain}%` : ""}</div>
        </div>
        <div class="outfit">
          <div class="outfit-title">오늘 옷차림 · ${label}</div>
          <div class="outfit-items">${items.map((i) => `<span class="chip">${i}</span>`).join("")}</div>
          <div class="hours">${w.hours.map((x) => `<div><span>${x.h}시</span>${icon(skyOf(x.c)[1], "h-icon")}<b>${x.t}°</b></div>`).join("")}</div>
        </div>
        <div class="w-tip"><span>${tip}</span>${citySel}</div>`;
    }
    $("#citySel").onchange = (e) => { api.setCity(e.target.value); loadWeather(); };
  }

  /* ---------- calendar ---------- */
  const byTime = (a, b) => (a.time || "99").localeCompare(b.time || "99");
  const eventsOn = (ds) => state.events.filter((e) => e.date === ds).sort(byTime);
  function renderCal() {
    const m = state.month, y = m.getFullYear(), mo = m.getMonth();
    $("#calTitle").textContent = `${y}년 ${mo + 1}월`;
    const start = addDays(m, -m.getDay());
    const weeks = Math.ceil((m.getDay() + new Date(y, mo + 1, 0).getDate()) / 7);
    const t = todayStr();
    let html = DOW.map((d) => `<div class="dow">${d}</div>`).join("");
    for (let i = 0; i < weeks * 7; i++) {
      const d = addDays(start, i), ds = ymd(d), evs = eventsOn(ds);
      const cls = ["day", d.getDay() === 0 && "sun", d.getDay() === 6 && "sat", d.getMonth() !== mo && "out", ds === t && "today"].filter(Boolean).join(" ");
      html += `<button class="${cls}" data-date="${ds}" aria-label="${md(ds)} 일정 ${evs.length}개">
        <span class="dnum">${d.getDate()}</span>
        ${evs.slice(0, 3).map((e) => `<span class="ev who-${esc(e.who)}">${e.time ? esc(e.time) + " " : ""}${esc(e.title)}</span>`).join("")}
        ${evs.length > 3 ? `<span class="more">+${evs.length - 3}개 더</span>` : ""}
      </button>`;
    }
    $("#cal").innerHTML = html;
  }

  /* ---------- modal ---------- */
  function openDay(ds) {
    state.modalDate = ds;
    $("#evWho").value = state.me;
    $("#overlay").hidden = false;
    renderModal();
    setTimeout(() => $("#evTitle").focus(), 0);
  }
  function renderModal() {
    if (!state.modalDate) return;
    const ds = state.modalDate, evs = eventsOn(ds);
    $("#mTitle").textContent = `${parse(ds).getMonth() + 1}월 ${parse(ds).getDate()}일 ${DOW[parse(ds).getDay()]}요일`;
    $("#mList").innerHTML = evs.length ? evs.map((e) => `<li class="who-${esc(e.who)}">
      <span class="tt">${e.time ? `<b>${esc(e.time)}</b> ` : ""}${esc(e.title)} <small style="color:var(--muted)">· ${esc(e.who)}</small></span>
      <button class="del" data-del-ev="${e.id}" aria-label="${esc(e.title)} 삭제">✕</button></li>`).join("")
      : '<li style="border:none;color:var(--muted);padding:0">아직 일정이 없어요. 아래에서 추가해 보세요.</li>';
  }
  function closeModal() { state.modalDate = null; $("#overlay").hidden = true; }

  /* ---------- todos ---------- */
  function dueTag(t) {
    if (!t.due) return "";
    const today = todayStr();
    const cls = t.done ? "" : t.due < today ? "late" : t.due === today ? "today" : "";
    const label = t.due === today ? "오늘" : t.due === ymd(addDays(new Date(), 1)) ? "내일" : md(t.due);
    return `<span class="due ${cls}">${label}</span>`;
  }
  const sortTodos = (a, b) => (a.done - b.done) || ((a.due || "9999").localeCompare(b.due || "9999")) || ((a.createdAt || 0) - (b.createdAt || 0));
  function todoItem(t, showOwner) {
    return `<li class="todo ${t.done ? "done" : ""}">
      <input type="checkbox" id="cb-${t.id}" data-toggle="${t.id}" ${t.done ? "checked" : ""}>
      <label class="t" for="cb-${t.id}">${showOwner ? `<span class="dot" style="background:${COLOR[t.owner]};margin-right:4px"></span>` : ""}${esc(t.text)}</label>
      ${dueTag(t)}
      <button class="del" data-del-todo="${t.id}" aria-label="${esc(t.text)} 삭제">✕</button></li>`;
  }
  function todoBlock(person, big) {
    const list = state.todos.filter((t) => t.owner === person).sort(sortTodos);
    const left = list.filter((t) => !t.done).length;
    return `<div class="todo-head"><span class="dot" style="background:${COLOR[person]};width:12px;height:12px"></span>${person} 할 일 <span class="badge">${left}개 남음</span></div>
      <ul class="todos">${list.length ? list.map((t) => todoItem(t)).join("") : `<li class="empty">할 일이 없어요 🎉</li>`}</ul>
      <form class="add" data-add-todo="${person}">
        <input type="text" id="new-${person}${big ? "-big" : ""}" maxlength="80" placeholder="${person} 할 일 추가" aria-label="${person} 할 일 추가" required>
        <input type="date" id="due-${person}${big ? "-big" : ""}" aria-label="마감일 (선택)">
        <button class="btn" type="submit">추가</button>
      </form>
      ${list.some((t) => t.done) ? `<button class="linkbtn" style="margin-top:6px" data-clear="${person}">완료한 항목 지우기</button>` : ""}`;
  }
  function renderTodos() {
    PEOPLE.forEach((p) => { $(`#todo-${p}`).innerHTML = todoBlock(p); });
  }

  /* ---------- today ---------- */
  function renderToday() {
    const t = todayStr(), tm = ymd(addDays(new Date(), 1));
    $("#todayLabel").textContent = md(t);
    const evRow = (e) => `<div class="trow"><time>${e.time ? esc(e.time) : "종일"}</time><span class="tt" style="border-color:${COLOR[e.who]}">${esc(e.title)} <small style="color:var(--muted)">${esc(e.who)}</small></span></div>`;
    const todayEv = eventsOn(t), tmrEv = eventsOn(tm);
    const dueTodos = state.todos.filter((x) => x.due && (x.due === t || (x.due < t && !x.done))).sort(sortTodos);
    $("#today").innerHTML = `
      <div>
        <p class="sub">오늘 일정</p>
        ${todayEv.length ? todayEv.map(evRow).join("") : '<div class="empty">오늘은 일정이 없어요. 달력에서 날짜를 눌러 추가하세요.</div>'}
        <p class="sub" style="margin-top:10px">오늘까지 할 일</p>
        <ul class="todos">${dueTodos.length ? dueTodos.map((x) => todoItem(x, true)).join("") : '<li class="empty">마감이 오늘인 할 일이 없어요.</li>'}</ul>
      </div>
      <div>
        <p class="sub tmr">내일 · ${md(tm)}</p>
        ${tmrEv.length ? tmrEv.map(evRow).join("") : '<div class="empty">내일 일정 없음</div>'}
      </div>`;
  }

  /* ---------- person view ---------- */
  function renderPerson() {
    const p = state.view; if (!PEOPLE.includes(p)) return;
    $("#personTodos").innerHTML = todoBlock(p, true);
    $("#personUpTitle").textContent = `${p}의 다가오는 일정 (2주)`;
    const t = todayStr(), end = ymd(addDays(new Date(), 14));
    const up = state.events.filter((e) => (e.who === p || e.who === "함께") && e.date >= t && e.date <= end)
      .sort((a, b) => a.date.localeCompare(b.date) || byTime(a, b));
    $("#personUp").innerHTML = up.length ? up.map((e) => `<div class="trow"><time style="width:78px;font-size:13px">${md(e.date)}</time>
      <span class="tt" style="border-color:${COLOR[e.who]}">${e.time ? `<b>${esc(e.time)}</b> ` : ""}${esc(e.title)}</span></div>`).join("")
      : '<div class="empty">2주 안에 잡힌 일정이 없어요.</div>';
  }

  function renderAll() { renderCal(); renderTodos(); renderToday(); renderPerson(); renderModal(); }

  /* ---------- events ---------- */
  document.addEventListener("click", (e) => {
    const el = e.target.closest("[data-date],[data-del-ev],[data-del-todo],[data-clear],[data-view]");
    if (!el) return;
    if (el.dataset.view) {
      state.view = el.dataset.view;
      document.querySelectorAll(".tab").forEach((b) => b.setAttribute("aria-selected", b === el));
      $("#dashView").hidden = state.view !== "dash";
      $("#personView").hidden = state.view === "dash";
      renderPerson();
    } else if (el.dataset.date) openDay(el.dataset.date);
    else if (el.dataset.delEv) guard(api.remove("events", el.dataset.delEv));
    else if (el.dataset.delTodo) guard(api.remove("todos", el.dataset.delTodo));
    else if (el.dataset.clear) api.clearDone(el.dataset.clear);
  });
  document.addEventListener("change", (e) => {
    const id = e.target.dataset?.toggle;
    if (id) guard(api.update("todos", id, { done: e.target.checked }));
  });
  document.addEventListener("submit", (e) => {
    const f = e.target.closest("[data-add-todo]"); if (!f) return;
    e.preventDefault();
    const owner = f.dataset.addTodo, txt = f.querySelector("input[type=text]"), due = f.querySelector("input[type=date]");
    const text = txt.value.trim(); if (!text) return;
    guard(api.add("todos", { owner, text, done: false, due: due.value || null, by: state.me, createdAt: Date.now() }));
    txt.value = ""; due.value = "";
  });
  $("#mForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("#evTitle").value.trim(); if (!title) return;
    guard(api.add("events", { date: state.modalDate, title, time: $("#evTime").value || null, who: $("#evWho").value, by: state.me, createdAt: Date.now() }));
    $("#evTitle").value = ""; $("#evTime").value = "";
  });
  $("#mClose").onclick = closeModal;
  $("#overlay").addEventListener("click", (e) => { if (e.target.id === "overlay") closeModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !$("#overlay").hidden) closeModal(); });
  $("#prevM").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() - 1, 1); renderCal(); };
  $("#nextM").onclick = () => { state.month = new Date(state.month.getFullYear(), state.month.getMonth() + 1, 1); renderCal(); };
  $("#todayM").onclick = () => { const n = new Date(); state.month = new Date(n.getFullYear(), n.getMonth(), 1); renderCal(); };
  $("#meSel").onchange = (e) => { state.me = e.target.value; store.set("planner.me", state.me); };

  let toastT;
  function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 3500); }

  tick(); setInterval(tick, 5000);
  renderAll(); renderWeather(); connect(); loadWeather(); setInterval(loadWeather, 30 * 60 * 1000);
})();
</script>
</body>
</html>
